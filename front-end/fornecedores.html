<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BikeCity - Fornecedores</title>
    <link rel="stylesheet" href="./ativos/css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar" aria-label="Navegação principal"></nav>
      <main class="content">
        <div class="page-title">
          <h1>Fornecedores</h1>
          <button id="btn-novo-fornecedor" type="button">Novo fornecedor</button>
        </div>
        <section id="secao-formulario-fornecedor" hidden>
          <h2 id="titulo-formulario-fornecedor">Cadastrar fornecedor</h2>
          <form id="form-fornecedor">
            <div class="form-row">
              <div class="form-group">
                <label for="fornecedor-nome">Nome</label>
                <input id="fornecedor-nome" required />
              </div>
              <div class="form-group">
                <label for="fornecedor-cnpj">CNPJ</label>
                <input id="fornecedor-cnpj" inputmode="numeric" />
              </div>
            </div>
            <div class="form-group">
              <label for="fornecedor-contato">Contato</label>
              <input id="fornecedor-contato" placeholder="E-mail ou telefone" />
            </div>
            <button type="submit">Salvar fornecedor</button>
            <button id="btn-cancelar-fornecedor" class="btn-secondary" type="button">
              Cancelar
            </button>
          </form>
        </section>
        <section>
          <h2>Lista de fornecedores</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>CNPJ</th>
                  <th>Contato</th>
                  <th>Status</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="tbody-fornecedores"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
      import { inicializarNavegacao } from './js/utilitarios/navigation.js';
      inicializarNavegacao();
    </script>
    <script type="module" src="./js/views/fornecedores.js"></script>
  </body>
</html>
