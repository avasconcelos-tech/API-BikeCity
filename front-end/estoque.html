<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BikeCity - Estoque</title>
    <link rel="stylesheet" href="./ativos/css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar" aria-label="Navegação principal"></nav>
      <main class="content">
        <h1>Estoque e Logística</h1>
        <section>
          <h2>Consulta por código / endereço</h2>
          <div class="form-row">
            <div class="form-group">
              <label>Código interno / código de barras</label
              ><input id="busca-codigo" placeholder="Ex.: BAT-001" />
            </div>
            <div class="form-group align-end">
              <button id="btn-buscar-codigo" type="button">Consultar</button>
            </div>
          </div>
          <div id="resultado-codigo"></div>
        </section>
        <section>
          <h2>Entrada / Recebimento</h2>
          <form id="form-entrada">
            <div class="form-row">
              <div class="form-group">
                <label>Produto</label
                ><select id="produto-entrada" required></select>
              </div>
              <div class="form-group">
                <label>Quantidade</label><input id="qtd-entrada" type="number" min="1" required />
              </div>
            </div>
            <div id="rastreio-entrada"></div>
            <div class="form-row">
              <div class="form-group">
                <label>Fornecedor</label
                ><select id="fornecedor-entrada" required></select>
              </div>
              <div class="form-group">
                <label>Nota fiscal</label><input id="nf-entrada" required />
              </div>
            </div>
            <div id="rastreio-saida"></div>
            <div class="form-row">
              <div class="form-group">
                <label>Pedido de compra</label><input id="pedido-entrada" required />
              </div>
              <div class="form-group">
                <label>Tipo de transporte</label
                ><input id="transporte-entrada" placeholder="Ex.: caminhão" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Montado/desmontado</label
                ><select id="montagem-entrada">
                  <option value="MONTADO">Montado</option>
                  <option value="DESMONTADO">Desmontado</option>
                  <option value="NAO_APLICA">Não se aplica</option>
                </select>
              </div>
              <div class="form-group">
                <label>Localização</label
                ><input id="localizacao-entrada" placeholder="Prateleira / depósito" />
              </div>
            </div>
            <div class="form-group">
              <label>Observação</label><textarea id="obs-entrada"></textarea>
            </div>
            <button>Confirmar Entrada</button>
          </form>
        </section>
        <section>
          <h2>Saída de Estoque</h2>
          <form id="form-saida">
            <div class="form-row">
              <div class="form-group">
                <label>Produto</label
                ><select id="produto-saida" required></select>
              </div>
              <div class="form-group">
                <label>Quantidade</label><input id="qtd-saida" type="number" min="1" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Destinação</label><input id="destino-saida" required />
              </div>
              <div class="form-group">
                <label>Motivo</label
                ><select id="motivo-saida" required>
                  <option>Venda</option>
                  <option>Uso interno</option>
                  <option>Manutenção</option>
                  <option>Outro</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Pedido de venda</label><input id="pedido-venda" required />
              </div>
              <div class="form-group"><label>Transporte</label><input id="transporte-saida" /></div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Montado/desmontado</label
                ><select id="montagem-saida">
                  <option value="MONTADO">Montado</option>
                  <option value="DESMONTADO">Desmontado</option>
                  <option value="NAO_APLICA">Não se aplica</option>
                </select>
              </div>
              <div class="form-group">
                <label>Localização/rota</label><input id="localizacao-saida" />
              </div>
            </div>
            <button>Confirmar Saída</button>
          </form>
        </section>
        <section>
          <h2>Devolução</h2>
          <form id="form-devolucao">
            <div class="form-row">
              <div class="form-group">
                <label>Produto</label
                ><select id="produto-devolucao" required></select>
              </div>
              <div class="form-group">
                <label>Quantidade</label><input id="qtd-devolucao" type="number" min="1" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Origem</label
                ><select id="origem-devolucao">
                  <option value="CLIENTE">Cliente</option>
                  <option value="PARA_FORNECEDOR">Para fornecedor</option>
                </select>
              </div>
              <div class="form-group">
                <label>Estado</label
                ><select id="estado-devolucao">
                  <option value="INTACTO">Intacto</option>
                  <option value="DANIFICADO">Danificado</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Pedido de venda</label><input id="pedido-devolucao" />
            </div>
            <div id="rastreio-devolucao"></div>
            <div class="form-group">
              <label>Motivo</label><textarea id="motivo-devolucao" required></textarea>
            </div>
            <label><input id="reaproveitavel" type="checkbox" /> Produto reaproveitável</label>
            <div class="form-group">
              <label>Observação</label><textarea id="obs-devolucao"></textarea>
            </div>
            <button>Registrar Devolução</button>
          </form>
        </section>
        <section id="secao-ajuste">
          <h2>Ajuste Manual — somente gerente</h2>
          <form id="form-ajuste">
            <div class="form-row">
              <div class="form-group">
                <label>Produto</label
                ><select id="produto-ajuste" required></select>
              </div>
              <div class="form-group">
                <label>Nova quantidade</label><input id="nova-qtd" type="number" min="0" required />
              </div>
            </div>
            <div class="form-group">
              <label>Justificativa</label><textarea id="justificativa" required></textarea>
            </div>
            <button>Registrar Ajuste</button>
          </form>
        </section>
        <section>
          <h2>Histórico</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Produto</th>
                  <th>Tipo</th>
                  <th>Qtd.</th>
                  <th>Alteração</th>
                  <th>Destinação</th>
                  <th>Motivo</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="tbody-estoque"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
      import { inicializarNavegacao } from './js/utilitarios/navigation.js';
      inicializarNavegacao();
    </script>
    <script type="module" src="./js/views/estoque.js"></script>
  </body>
</html>
