<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BikeCity - Produtos</title>
    <link rel="stylesheet" href="./ativos/css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar" aria-label="Navegação principal"></nav>
      <main class="content">
        <div class="page-title">
          <h1>Catálogo de Produtos</h1>
          <button id="btn-novo-produto">+ Cadastrar Produto</button>
        </div>
        <div class="product-filters">
          <label for="busca-produtos">Buscar produto</label>
          <input id="busca-produtos" placeholder="Nome ou código interno" />
          <label class="show-password" for="mostrar-inativos"
            ><input id="mostrar-inativos" type="checkbox" /> Mostrar inativos</label
          >
        </div>
        <div class="table-responsive products-table-responsive">
          <table class="products-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Localização</th>
                <th>Custo</th>
                <th>Estoque</th>
                <th>Status</th>
                <th id="th-acao-produto">Ação</th>
              </tr>
            </thead>
            <tbody id="tbody-produtos"></tbody>
          </table>
        </div>
      </main>
    </div>
    <div id="modal-produto" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="titulo-modal-produto">Novo Produto</h3>
          <button id="btn-fechar-modal" class="btn-close">&times;</button>
        </div>
        <form id="form-produto">
          <div class="form-group"><label>Nome completo</label><input id="nome" required /></div>
          <div class="form-row">
            <div class="form-group">
              <label>Código interno / barras</label><input id="codigo_interno" required />
            </div>
            <div class="form-group">
              <label>Categoria</label
              ><select id="categoria" required>
                <option value="">Selecione...</option>
                <option value="VEICULO">Bicicletas / Patinetes</option>
                <option value="PECA_ESTRUTURAL">Peça estrutural</option>
                <option value="COMPONENTE_ELETRICO">Componente elétrico / Bateria</option>
                <option value="PECA_SEGURANCA">Peça de segurança (freios/pneus)</option>
                <option value="PECA_DESGASTE">Peça de desgaste</option>
                <option value="ACESSORIO">Acessório</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Unidade de medida</label
              ><select id="unidade_medida" required>
                <option value="UN">Unidade</option>
                <option value="CX">Caixa</option>
                <option value="PAR">Par</option>
              </select>
            </div>
            <div class="form-group">
              <label>Custo (R$)</label
              ><input id="custo" type="number" step="0.01" min="0" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Fornecedor</label
              ><select id="fornecedor_id" required></select>
            </div>
            <div class="form-group">
              <label>Localização (prateleira/depósito)</label
              ><input id="localizacao_deposito" required />
            </div>
            <div class="form-group">
              <label>Estado</label
              ><select id="estado_montagem">
                <option value="MONTADO">Montado</option>
                <option value="DESMONTADO">Desmontado</option>
                <option value="NAO_APLICA">Não se aplica</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Tipo de rastreabilidade</label
            ><select id="tipo_rastreabilidade">
              <option value="NENHUMA">Nenhuma</option>
              <option value="BATERIA">Bateria — série + validade</option>
              <option value="MOTOR_CONTROLADOR">Motor/controlador — série + lote</option>
              <option value="VEICULO">Veículo — ID único</option>
              <option value="PECA_SEGURANCA">Freio/pneu — lote</option>
            </select>
          </div>
          <div class="form-group">
            <label>Demanda prevista no período</label
            ><input id="demanda_prevista" type="number" min="0" value="0" />
          </div>
          <div class="form-group">
            <label>Estoque mínimo</label
            ><input id="estoque_minimo" type="number" min="0" value="5" required />
          </div>
          <div class="form-group">
            <label>Dimensões (obrigatórias para veículos)</label><input id="dimensoes" />
          </div>
          <div class="form-group">
            <label for="imagem">Imagem do produto</label
            ><input id="imagem" type="file" accept="image/png,image/jpeg" />
          </div>
          <button>Salvar Produto</button>
        </form>
      </div>
    </div>
    <script type="module" src="./js/views/produto.js"></script>
    <script type="module">
      import { inicializarNavegacao } from './js/utilitarios/navigation.js';
      inicializarNavegacao();
    </script>
  </body>
</html>
