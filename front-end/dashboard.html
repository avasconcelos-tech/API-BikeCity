<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BikeCity - Dashboard</title>
    <link rel="stylesheet" href="./ativos/css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <nav class="sidebar" aria-label="Navegação principal"></nav>
      <main class="content">
        <header class="content-header">
          <div>
            <h1>Painel de Controle</h1>
            <p class="subtitle">Visão geral do estoque e da operação.</p>
          </div>
        </header>
        <div class="cards-grid">
          <div
            class="card dashboard-card"
            id="card-total-produtos"
            role="button"
            tabindex="0"
            aria-label="Ver todos os produtos"
          >
            <h3>Total de Produtos</h3>
            <p id="total-produtos">-</p>
          </div>
          <div
            class="card dashboard-card dashboard-card-alerta"
            id="card-estoque-critico"
            role="button"
            tabindex="0"
            aria-label="Ver produtos em alerta de estoque"
          >
            <h3>Itens em Alerta (Baixo)</h3>
            <p id="estoque-critico" class="dashboard-critical">-</p>
          </div>
          <div
            class="card dashboard-card"
            id="card-valor-estoque"
            role="button"
            tabindex="0"
            aria-label="Ver relatório das peças em estoque"
          >
            <h3>Valor Total em Estoque</h3>
            <p id="valor-estoque">-</p>
          </div>
        </div>
      </main>
    </div>
    <div id="modal-dashboard-produtos" class="modal-overlay" aria-hidden="true">
      <div class="modal-card dashboard-modal">
        <div class="modal-header">
          <h3 id="titulo-produtos-dashboard">Produtos</h3>
          <button
            id="btn-fechar-dashboard-produtos"
            class="btn-close"
            type="button"
            aria-label="Fechar"
          >
            &times;
          </button>
        </div>
        <div class="table-responsive">
          <table>
            <thead id="thead-dashboard-produtos">
              <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Estoque</th>
                <th>Localização</th>
              </tr>
            </thead>
            <tbody id="tbody-dashboard-produtos"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script type="module">
      import { inicializarNavegacao } from './js/utilitarios/navigation.js';
      inicializarNavegacao();
    </script>
    <script type="module" src="./js/views/dashboard.js"></script>
  </body>
</html>
